name: Build & Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag matching the checked-out Bundle version
        required: true
        type: string
  push:
    tags:
      - 'v*'

concurrency:
  group: senseflow-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1

      - name: Select Xcode
        run: |
          # Use latest available Xcode (need Swift tools >= 6.1.0 for KeyboardShortcuts)
          ls -d /Applications/Xcode*.app | sort -V | tail -1 | xargs sudo xcode-select -s
          xcodebuild -version

      - name: Validate signing secrets
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for key in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD MACOS_SIGNING_IDENTITY MACOS_TEAM_ID SPARKLE_ED_PRIVATE_KEY; do
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required signing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Import signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/senseflow-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/senseflow-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERT_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "SPM_CLONED_DIR=$RUNNER_TEMP/spm-cloned" >> "$GITHUB_ENV"

      - name: Resolve package dependencies
        run: |
          set -euo pipefail
          rm -rf "$SPM_CLONED_DIR"
          mkdir -p "$SPM_CLONED_DIR"
          xcodebuild -resolvePackageDependencies \
            -project SenseFlow.xcodeproj \
            -scheme SenseFlow \
            -clonedSourcePackagesDirPath "$SPM_CLONED_DIR"

      - name: Build for Apple Silicon (unsigned)
        run: |
          set -euo pipefail
          xcodebuild -project SenseFlow.xcodeproj \
            -scheme SenseFlow \
            -configuration Release \
            -arch arm64 \
            -derivedDataPath build \
            MARKETING_VERSION="${RELEASE_TAG#v}" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -clonedSourcePackagesDirPath "$SPM_CLONED_DIR"

      - name: Sign app bundle
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release/SenseFlow.app"
          ENTITLEMENTS_PATH="SenseFlow/SenseFlow.entitlements"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::App bundle not found at $APP_PATH"
            exit 1
          fi

          # Sparkle contains XPC services and nested helper apps. Sign from the inside out.
          while IFS= read -r -d '' nested; do
            codesign --force --options runtime --sign "$MACOS_SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" "$nested"
          done < <(find "$APP_PATH/Contents" -depth -type d \( -name '*.framework' -o -name '*.app' -o -name '*.xpc' \) -print0)
          ROOT_ARGS=(--force --options runtime --sign "$MACOS_SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH")
          if [ -f "$ENTITLEMENTS_PATH" ]; then
            ROOT_ARGS+=(--entitlements "$ENTITLEMENTS_PATH")
          fi
          codesign "${ROOT_ARGS[@]}" "$APP_PATH"

      - name: Verify app signature
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release/SenseFlow.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dvv "$APP_PATH" 2>&1 | sed -n '1,40p'
          codesign -dv "$APP_PATH" 2>&1 | grep -qx 'TeamIdentifier=FPVWZ792P2'
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP_PATH/Contents/Info.plist")" = com.senseflow.SenseFlow

      - name: Create DMG
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release/SenseFlow.app"
          DMG_NAME="senseflow-${RELEASE_TAG}-arm64.dmg"

          # Create temporary DMG directory
          mkdir -p dmg_staging
          cp -R "$APP_PATH" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          mkdir -p dmg_staging/.background
          cp installer/background.png dmg_staging/.background/background.png
          cp installer/FinderLayout dmg_staging/.DS_Store

          # Create DMG
          hdiutil create -volname "SenseFlow" \
            -srcfolder dmg_staging \
            -ov -format UDZO \
            "$DMG_NAME"

          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_ENV

      - name: Generate signed update feed
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          SPARKLE_TOOLS="$RUNNER_TEMP/sparkle-tools"
          mkdir -p "$SPARKLE_TOOLS" updates
          curl --fail --location https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz -o "$SPARKLE_TOOLS/tools.tar.xz"
          tar -xf "$SPARKLE_TOOLS/tools.tar.xz" -C "$SPARKLE_TOOLS"
          cp "$DMG_NAME" updates/
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$SPARKLE_TOOLS/bin/generate_appcast" \
            --ed-key-file - --maximum-deltas 0 \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/" \
            --link https://senseflow.top/ updates

      - name: Validate release metadata and public-key signature
        run: |
          python3 scripts/validate-update-feed.py \
            --app build/Build/Products/Release/SenseFlow.app \
            --archive "$DMG_NAME" --feed updates/appcast.xml \
            --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"
          shasum -a 256 "$DMG_NAME" > SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          prerelease: false
          files: |
            ${{ env.DMG_NAME }}
            updates/appcast.xml
            SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
